name: Keep API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://diegosmind-api.onrender.com/api/Post)
          echo "API responded with status $STATUS"
